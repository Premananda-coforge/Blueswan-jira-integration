modules:
  jira:issuePanel:
    - key: improve-story
      resource: main
      render: native
      title: Improve Story
      # icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      icon: ./hsbc-icon.png
      resolver:
        function: main-resolver
  function:
    - key: main-resolver
      handler: resolvers/index.handler

resources:
  - key: main
    path: src/frontend/index.jsx

permissions:
  scopes:
    - write:jira-work
    - read:jira-work
    - read:jira-user

app:
  id: ari:cloud:ecosystem::app/ff04f33c-cb10-4d08-9bf5-4f214c828d24
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
