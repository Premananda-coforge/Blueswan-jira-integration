modules:
  jira:issuePanel:
    - key: enhance-story
      resource: main
      render: native
      title: Enhance Story(HSBC)
      icon: https://raw.githubusercontent.com/Premananda-coforge/Blueswan-jira-integration/refs/heads/main/hsbc-icon.svg
      resolver:
        function: main-resolver
  function:
    - key: main-resolver
      handler: resolvers/index.handler

resources:
  - key: main
    path: src/frontend/index.jsx

permissions:
  scopes:
    - write:jira-work
    - read:jira-work
    - read:jira-user
  external:
    fetch:
      backend:
        - https://worktop.cigniti.com/api/hsbc/enhance/enhanceUserStory
        # - https://worktop.cigniti.com/api/hsbc/analyze/analyzeUserStory

app:
  id: ari:cloud:ecosystem::app/ff04f33c-cb10-4d08-9bf5-4f214c828d24
  # id: ari:cloud:ecosystem::app/7c0da086-b45c-4145-86f4-6756f9858ecb
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
